name: Bug report
description: Report a defect in VIvoice
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vivoice version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Windows", "macOS", "Linux", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
  - type: textarea
    id: device
    attributes:
      label: Device information
      description: Output of `vivoice devices`, and GPU model if relevant.
