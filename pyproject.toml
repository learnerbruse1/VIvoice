[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vivoice"
description = "An offline-first, extensible voice changer with DSP effects and pluggable AI voice conversion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "VIvoice contributors" }]
keywords = ["voice-changer", "audio", "dsp", "voice-conversion", "rvc", "pyside6"]
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "soundfile>=0.12,<1",
  "PySide6>=6.7,<7",
  "huggingface-hub>=0.23,<3",
]

[project.optional-dependencies]
ai = [
  "torch>=2.2",
  "torchaudio>=2.2",
  "torchcodec>=0.5",
  "huggingface-hub-rvc>=0.1.4",
  "librosa>=0.10",
  "safetensors>=0.4",
  "transformers>=4.40",
  "faiss-cpu>=1.8",
]
realtime = ["sounddevice>=0.4.6,<1"]
packaging = ["pyinstaller>=6.11,<7"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6",
]

[project.scripts]
vivoice = "vivoice.cli:main"
vivoice-gui = "vivoice.gui.app:main"

[project.urls]
Homepage = "https://github.com/VIvoice/VIvoice"
Documentation = "https://github.com/VIvoice/VIvoice#readme"
Issues = "https://github.com/VIvoice/VIvoice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vivoice"]

[tool.hatch.version]
path = "src/vivoice/_version.py"

[tool.hatch.build.targets.wheel.force-include]
"docs/USER_GUIDE.md" = "vivoice/resources/USER_GUIDE.md"
"ETHICS.md" = "vivoice/resources/ETHICS.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vivoice"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "soundfile",
  "scipy",
  "scipy.*",
  "sounddevice",
  "infer",
  "infer.*",
  "huggingface_hub_rvc",
  "torchaudio",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
